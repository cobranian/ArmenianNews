# Le contrôle strict sur les modifications HUMAINES d'une PR Culture : un
# commit du relecteur (synchronize) ou la case « Faits vérifiés » cochée
# (edited). Les commits du robot sont contrôlés par articles*.yml eux-mêmes.
name: Culture — contrôle

on:
  pull_request:
    types: [synchronize, edited, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  check:
    if: startsWith(github.head_ref, 'culture/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref }}
      BODY: ${{ github.event.pull_request.body }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contrôler
        run: |
          SLUG="${BRANCH#culture/}"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          # Un rattrapage de/it (articles-backfill.yml) n'est pas un article :
          # tous les articles sont contrôlés, sans la case « Faits vérifiés »
          # (de/it facultatives, non relues — le propriétaire fusionne).
          case "$SLUG" in
            backfill-*) set -- ;;
            *) set -- --pr-body "$RUNNER_TEMP/body.md" "$SLUG" ;;
          esac
          if node scripts/culture-check.mjs "$@" > "$RUNNER_TEMP/check.txt"; then state=success; else state=failure; fi
          cat "$RUNNER_TEMP/check.txt"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=culture-check -f description="$(tail -n 1 "$RUNNER_TEMP/check.txt")"
          [ "$state" = success ]
