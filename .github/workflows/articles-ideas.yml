# Idées de sujets validées par commentaire : sous l'issue « Culture : idées de
# sujets » (ouverte par articles.yml), le propriétaire écrit `/ajoute 1 4 7`
# ou `/rejette 2 3` depuis son téléphone. Le robot ajoute les idées retenues à
# src/data/culture/sujets.json sur main, réécrit le corps de l'issue (lignes
# traitées barrées), répond, et ferme l'issue quand plus rien n'attend.
#
# SÉCURITÉ : seul le PROPRIÉTAIRE du dépôt déclenche ce job (garde du `if:`),
# jamais sur une PR, et seulement sur l'issue ouverte PAR LE ROBOT : le dépôt
# est public, une issue homonyme d'un tiers porterait un bloc JSON fabriqué
# qu'un /ajoute ferait entrer dans sujets.json. Le commentaire et le corps de
# l'issue n'atteignent le script que par env: ou par fichier — jamais
# interpolés dans un run:. Le script relit la commande (parseIdeaCommand).
#
# Le push sur main par GITHUB_TOKEN ne déclenche pas de déploiement : rien à
# déployer, sujets.json n'est lu que par le brouillon de la nuit.
name: Culture — idées de sujets

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  ideas:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.title == 'Culture : idées de sujets' &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/ajoute') || startsWith(github.event.comment.body, '/rejette'))
    # Sous le job, pas au niveau du workflow : là, n'importe quel commentaire
    # (job ensuite sauté par le if:) entrerait dans le groupe et évincerait en
    # silence une commande en attente. GitHub ne garde qu'UN run en attente :
    # une troisième commande rapprochée remplace la deuxième, qui ne reçoit
    # alors ni 👀 ni réponse — un 👀 absent veut dire « commande perdue,
    # renvoyez-la ».
    concurrency:
      group: culture-ideas
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Accuser réception
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes || true

      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Appliquer la commande
        id: apply
        continue-on-error: true
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$COMMENT" > "$RUNNER_TEMP/comment.md"
          # Le corps est relu ici, après l'attente du groupe de concurrence :
          # celui de l'événement daterait d'avant la commande précédente.
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/body.md"
          node scripts/culture-ideas.mjs \
            --comment "$RUNNER_TEMP/comment.md" \
            --issue-body "$RUNNER_TEMP/body.md" \
            --out-body "$RUNNER_TEMP/new-body.md" \
            --out-reply "$RUNNER_TEMP/reply.md" \
            --out-done "$RUNNER_TEMP/done"

      - name: Pousser sur main, réécrire l'issue
        id: pub
        if: steps.apply.outcome == 'success'
        run: |
          # Commande non reconnue : le script n'a rien réécrit.
          [ -f "$RUNNER_TEMP/new-body.md" ] || exit 0
          # Chaque échec s'inscrit dans la réponse, que l'étape suivante poste
          # quoi qu'il arrive.
          fail() { printf '\n⚠️ **Publication incomplète** : %s\n' "$1" >> "$RUNNER_TEMP/reply.md"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/culture/sujets.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture : sujets ajoutés depuis les idées" || fail "commit impossible."
            pushed=
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && { pushed=1; break; }
              git rebase --abort 2>/dev/null || true
              [ "$i" -lt 3 ] && sleep 10
            done
            # Sans sujets.json sur main, l'issue ne doit pas annoncer d'ajout.
            [ -n "$pushed" ] || fail "sujets.json n'a pas pu être poussé sur main : rien n'a changé, renvoyez la commande."
          fi
          gh issue edit "$ISSUE" --body-file "$RUNNER_TEMP/new-body.md" || fail "sujets.json est à jour, mais le corps de l'issue n'a pas été réécrit."

      - name: Répondre
        if: always()
        env:
          APPLY: ${{ steps.apply.outcome }}
          PUB: ${{ steps.pub.outcome }}
        run: |
          # La fermeture n'est annoncée qu'une fois faite (on peut commenter
          # une issue fermée : la réponse part après).
          if [ "$PUB" = success ] && [ -f "$RUNNER_TEMP/done" ]; then
            if gh issue close "$ISSUE"; then
              printf '%s\n' "Plus aucune idée en attente : issue fermée." >> "$RUNNER_TEMP/reply.md"
            else
              printf '\n%s\n' "⚠️ Plus aucune idée en attente, mais l'issue n'a pas pu être fermée : fermez-la à la main." >> "$RUNNER_TEMP/reply.md"
            fi
          fi
          if [ -f "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
          else
            gh issue comment "$ISSUE" --body "❌ La commande a échoué avant toute modification : voir le journal du workflow « Culture — idées de sujets »."
          fi
          [ "$APPLY" = success ] && [ "$PUB" != failure ] || exit 1
