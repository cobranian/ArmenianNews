# PR Culture fusionnée À LA MAIN avant ses traductions → on traduit sur main.
#
# Le cas réel (PR #36, 25 oct. 2026) : la case « Faits vérifiés » et
# l'étiquette « traduire » ont lancé deux traductions, et la PR a été fusionnée
# depuis l'interface 45 s plus tard, avec le seul fr.md. Les traductions ont
# atterri sur la branche déjà fusionnée : l'article est parti en français seul,
# sans aucun échec visible.
#
# Une protection de main exigeant culture-check n'est PAS la parade : le job
# horaire pousse ses instantanés directement sur main et serait refusé.
#
# Seule une fusion humaine déclenche ce workflow : celle d'articles-publish.yml
# se fait avec le GITHUB_TOKEN, qui ne déclenche aucun événement (et elle a
# déjà ses traductions).
name: Culture — traductions après fusion

on:
  pull_request:
    types: [closed]
  # Rattrapage à la main d'un article déjà publié (traductions ou Short
  # manquants) : gh workflow run articles-merged.yml -f slug=<slug>
  workflow_dispatch:
    inputs:
      slug:
        description: Article à rattraper (dossier de src/data/culture)
        required: true

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: culture-merged-main
  cancel-in-progress: false

jobs:
  translate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'culture/') &&
      !startsWith(github.head_ref, 'culture/backfill-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref || format('culture/{0}', inputs.slug) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Traduire ce qui manque, pousser, déployer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTICLES_BASE_URL: ${{ vars.ARTICLES_BASE_URL }}
          ARTICLES_MODEL: ${{ vars.ARTICLES_MODEL }}
        run: |
          SLUG="${BRANCH#culture/}"
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "slug invalide : $SLUG"; exit 1; }
          D="src/data/culture/$SLUG"
          [ -f "$D/fr.md" ] || { echo "Pas d'article $SLUG sur main : rien à faire."; exit 0; }
          missing=""
          for l in en hy ru de it es; do [ -f "$D/$l.md" ] || missing="$missing $l"; done
          # Contrôle « tout présent et conforme » : il ne décide plus QUOI
          # traduire, seulement si les articles absents de/it/es (simples notes)
          # comptent. Le quoi vient du plan, comme dans articles-publish.yml :
          # un article relu et à jour n'est JAMAIS retraduit ni poussé sur main
          # à cause de sa vidéo — un Short absent, périmé ou non conforme ne
          # relance que son Short (--short-only).
          if [ -z "$missing" ] && node scripts/culture-check.mjs "$SLUG"; then PASSED=--check-passed; else PASSED=; fi
          node scripts/culture-translate-plan.mjs "$SLUG" $PASSED > "$RUNNER_TEMP/plan.txt"
          if [ ! -s "$RUNNER_TEMP/plan.txt" ]; then
            echo "Traductions présentes et à jour : rien à faire."
            # Les Shorts de l'article (video.yml), sans retenir la publication.
            gh workflow run video.yml --ref main -f slug="$SLUG" || true
            exit 0
          fi
          echo "Passages de traduction (manquantes :${missing:- aucune}) :"
          cat "$RUNNER_TEMP/plan.txt"
          # Un passage par ligne ; $args non cité exprès (options et codes de
          # langue). Un passage en échec n'arrête pas les autres.
          # L'état du fichier fait foi, pas le résumé (voir articles-publish.yml).
          short_avant=; [ -f "$D/short.fr.json" ] && short_avant=1
          n=0
          while read -r args; do
            n=$((n + 1))
            node scripts/culture-translate.mjs "$SLUG" $args --summary "$RUNNER_TEMP/summary-$n.md" < /dev/null || true
          done < "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP"/summary-*.md > "$RUNNER_TEMP/summary.md" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          if git diff --cached --quiet; then
            # Les langues déjà prêtes partent quand même en vidéo.
            gh workflow run video.yml --ref main -f slug="$SLUG" || true
            [ -n "$PR" ] && gh pr comment "$PR" --body "⚠️ Fusionnée sans traductions, et la traduction automatique n'a rien produit : relancez \`npm run culture:translate $SLUG\`." || true
            exit 1
          fi
          git commit -m "Culture : traductions de « $SLUG » (après fusion)"
          # Le texte de la vidéo française rédigé ICI (absent de la PR) :
          # personne ne l'a lu. Il est sur main, mais aucune vidéo n'en est
          # rendue avant relecture. La marque est SHORT_DRAFTED_MARK
          # (scripts/lib/culture-short.mjs).
          drafted=
          if grep -q "texte de la vidéo rédigé à la publication" "$RUNNER_TEMP/summary.md" 2>/dev/null; then drafted=1; fi
          if [ -z "$short_avant" ] && [ -f "$D/short.fr.json" ]; then drafted=1; fi
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # Un push par GITHUB_TOKEN ne déclenche pas le déploiement.
              gh workflow run hourly.yml --ref main
              # Les traductions sont sur main : les Shorts peuvent partir —
              # sauf d'un texte de vidéo que personne n'a relu.
              if [ -z "$drafted" ]; then gh workflow run video.yml --ref main -f slug="$SLUG" || true; fi
              {
                echo "Fusionnée avant ses traductions : elles ont été faites sur main et déployées."
                echo
                if [ -n "$drafted" ]; then
                  echo "⏸️ **Vidéos non rendues** : le texte de la vidéo (\`src/data/culture/$SLUG/short.fr.json\`, recopié ci-dessous) vient d'être rédigé sur main, sans relecture. Relisez-le (corrigez-le par une PR au besoin), puis lancez \`gh workflow run video.yml --ref main -f slug=$SLUG\`."
                  echo
                fi
                [ -f "$RUNNER_TEMP/summary.md" ] && cat "$RUNNER_TEMP/summary.md"
              } > "$RUNNER_TEMP/comment.md"
              [ -n "$PR" ] && gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" || true
              exit 0
            fi
            sleep 10
          done
          exit 1
