# Publication en un geste : quand le relecteur coche « Faits vérifiés » dans la
# PR (ou pousse une correction alors que la case est déjà cochée), le robot
# traduit si besoin, contrôle, FUSIONNE et relance le déploiement.
#
# Deux pièges GitHub, tous deux contournés ici :
# - un commit poussé avec le GITHUB_TOKEN ne déclenche aucun autre workflow :
#   ce job traduit, contrôle et publie le statut lui-même ;
# - une fusion faite avec le GITHUB_TOKEN ne déclenche PAS le push sur main,
#   donc pas le déploiement : on le lance explicitement (workflow_dispatch est
#   la seule exception autorisée), sinon l'article attendrait l'heure suivante.
#
# La relecture humaine reste la condition : rien ne part tant que la case
# n'est pas cochée. Cocher la case est donc le DERNIER geste.
name: Culture — publication

on:
  pull_request:
    types: [edited, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

# Groupe PARTAGÉ avec articles-translate.yml : cocher la case et poser
# l'étiquette au même moment lançaient deux traductions concurrentes, dont
# l'une échouait au rebase (PR #36). Ici on annule un run en cours : ce job
# retraduit lui-même ce qui manque.
concurrency:
  group: culture-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    # contains() n'est qu'un préfiltre : il voit aussi la section du robot.
    # L'étape « Case cochée par le relecteur » décide.
    if: >-
      startsWith(github.head_ref, 'culture/') &&
      github.event.pull_request.state == 'open' &&
      (contains(github.event.pull_request.body, '- [x] Faits vérifiés') ||
       contains(github.event.pull_request.body, '- [X] Faits vérifiés'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      BODY: ${{ github.event.pull_request.body }}
      # Le même corps, encodé en JSON : un octet NUL y reste « \u0000 » au lieu
      # de tronquer la variable (F7). C'est celui que lit la décision.
      BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # La case du RELECTEUR, hors de la section du robot : celle-ci recopie
      # des titres de tiers, et un événement intitulé « x] Faits vérifiés … »
      # y passait pour la case cochée. Le code est lu sur la branche de BASE,
      # pas sur la branche relue : une branche culture/* ouverte avant ce
      # contrôle en garderait l'ancienne version, qui lisait tout le corps.
      - name: Case cochée par le relecteur
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:scripts/lib/culture-checkbox.mjs > "$RUNNER_TEMP/culture-checkbox.mjs"
          node --input-type=module -e '
            import { pathToFileURL } from "node:url"
            const { factsChecked } = await import(pathToFileURL(process.argv[1]).href)
            if (!factsChecked(JSON.parse(process.env.BODY_JSON))) {
              console.log("::error::« Faits vérifiés » n’est pas cochée hors de la section du robot : rien n’est publié.")
              process.exit(1)
            }
          ' "$RUNNER_TEMP/culture-checkbox.mjs"

      - run: npm ci

      - name: Contrôler, traduire si besoin
        id: prep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTICLES_BASE_URL: ${{ vars.ARTICLES_BASE_URL }}
          ARTICLES_MODEL: ${{ vars.ARTICLES_MODEL }}
        run: |
          SLUG="${BRANCH#culture/}"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if node scripts/culture-check.mjs --pr-body "$RUNNER_TEMP/body.md" "$SLUG" > "$RUNNER_TEMP/check.txt"; then
            PASSED=--check-passed
          else
            PASSED=
            cat "$RUNNER_TEMP/check.txt"
          fi
          # Ce qu'il faut traduire, et rien de plus (culture-translate-plan.mjs) :
          # un article à jour, déjà relu, n'est JAMAIS retraduit — un Short
          # périmé ou non conforme ne relance que son Short (--short-only), et
          # même conforme, un Short absent est rattrapé (sinon pas de vidéo).
          node scripts/culture-translate-plan.mjs "$SLUG" $PASSED > "$RUNNER_TEMP/plan.txt"
          if [ ! -s "$RUNNER_TEMP/plan.txt" ]; then
            echo "Rien à traduire${PASSED:+ : déjà conforme}."
            exit 0
          fi
          echo "Passages de traduction :"
          cat "$RUNNER_TEMP/plan.txt"
          # Un passage par ligne (« --langs ru », « --short-only --langs en ») ;
          # $args non cité exprès : des options et des codes de langue. Un
          # passage ou une langue en échec n'arrête pas les autres.
          # L'état du fichier fait foi, pas le résumé : un passage qui meurt
          # après avoir écrit short.fr.json mais avant son résumé ne doit pas
          # laisser partir un texte de vidéo que personne n'a lu.
          SHORT_FR="src/data/culture/$SLUG/short.fr.json"
          short_avant=; [ -f "$SHORT_FR" ] && short_avant=1
          n=0
          while read -r args; do
            n=$((n + 1))
            node scripts/culture-translate.mjs "$SLUG" $args --summary "$RUNNER_TEMP/summary-$n.md" < /dev/null || true
          done < "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP"/summary-*.md > "$RUNNER_TEMP/summary.md" 2>/dev/null || true
          if [ -z "$short_avant" ] && [ -f "$SHORT_FR" ]; then
            echo "shortdrafted=1" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/culture
          git diff --cached --quiet || git commit -m "Culture : traductions de « $SLUG »"
          if ! git pull --rebase origin "$BRANCH"; then
            git rebase --abort || true
            gh pr comment "$PR" --body "La branche a changé pendant la traduction : la publication reprendra au prochain enregistrement de la PR." || true
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          [ -f "$RUNNER_TEMP/summary.md" ] && gh pr comment "$PR" --body-file "$RUNNER_TEMP/summary.md" || true
          # Traduit par le modèle de SECOURS (Gemini en panne ou sans crédit) :
          # on ne fusionne pas d'office un hy/ru qu'aucun humain n'a vu. Un
          # second geste suffit : au recochage, les traductions sont déjà là,
          # le contrôle passe sans retraduire, et l'article part.
          if grep -q "modèle de secours" "$RUNNER_TEMP/summary.md" 2>/dev/null; then
            echo "fallback=1" >> "$GITHUB_OUTPUT"
          fi
          # Le texte de la vidéo française rédigé PENDANT cette publication
          # (short.fr.json absent du brouillon) : la case cochée ne l'a pas
          # approuvé, et il partirait sur YouTube tel quel. Même second geste.
          # La marque est SHORT_DRAFTED_MARK (scripts/lib/culture-short.mjs).
          if grep -q "texte de la vidéo rédigé à la publication" "$RUNNER_TEMP/summary.md" 2>/dev/null; then
            echo "shortdrafted=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Traductions de secours — attendre le relecteur
        if: steps.prep.outputs.fallback == '1'
        run: |
          gh pr comment "$PR" --body "⏸️ **Pas encore fusionné.** Gemini n'a pas répondu : les traductions viennent du modèle de secours (voir le commentaire ci-dessus). Jetez un œil à en/hy/ru (articles et textes des vidéos, short.*.json) dans l'onglet *Files changed*, puis **décochez et recochez « Faits vérifiés »** : l'article partira aussitôt, sans nouvelle traduction." || true

      - name: Texte de la vidéo rédigé à la publication — attendre le relecteur
        if: steps.prep.outputs.shortdrafted == '1' && steps.prep.outputs.fallback != '1'
        run: |
          gh pr comment "$PR" --body "⏸️ **Pas encore fusionné.** Le brouillon n'avait pas de texte de vidéo : le robot vient d'en rédiger un (short.fr.json, recopié dans le commentaire ci-dessus), que la case cochée n'a donc pas approuvé. Relisez-le (corrigez-le au besoin dans l'onglet *Files changed*), puis **décochez et recochez « Faits vérifiés »** : l'article partira avec sa vidéo, sans nouvelle rédaction." || true

      - name: Contrôle final, fusion, déploiement
        if: steps.prep.outputs.fallback != '1' && steps.prep.outputs.shortdrafted != '1'
        run: |
          SLUG="${BRANCH#culture/}"
          SHA="$(git rev-parse HEAD)"
          if node scripts/culture-check.mjs --pr-body "$RUNNER_TEMP/body.md" "$SLUG" > "$RUNNER_TEMP/check.txt"; then state=success; else state=failure; fi
          cat "$RUNNER_TEMP/check.txt"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=culture-check -f description="$(tail -n 1 "$RUNNER_TEMP/check.txt")"
          if [ "$state" != success ]; then
            {
              echo "**Publication suspendue** — le contrôle a trouvé :"
              echo
              grep '^✗' "$RUNNER_TEMP/check.txt" | head -10 | sed 's/^/- /'
              echo
              echo "Corrigez puis enregistrez la PR (ou décochez et recochez « Faits vérifiés ») pour relancer."
            } > "$RUNNER_TEMP/fail.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/fail.md" || true
            exit 1
          fi
          gh pr merge "$PR" --merge --match-head-commit "$SHA"
          # Branche supprimée par l'API : « gh pr merge --delete-branch » voudrait
          # basculer le clone local sur main, absent d'un checkout superficiel.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
          gh workflow run hourly.yml --ref main
          # Les Shorts de l'article : rendus, déposés et mis en file par video.yml.
          # Un échec ici ne retient pas l'article, déjà fusionné.
          gh workflow run video.yml --ref main -f slug="$SLUG" || true
          gh pr comment "$PR" --body "✅ Fusionné : l'article sera en ligne sur armenieinfo.ch et armenianews.org dans 5 à 10 minutes (déploiement lancé)." || true

      # Un échec ici ne doit plus attendre qu'on le découvre : le tableau de
      # bord (social-check.yml) est relancé et notifie s'il y a du neuf.
      - name: Prévenir le tableau de bord
        if: failure()
        run: gh workflow run social-check.yml --ref main || true
