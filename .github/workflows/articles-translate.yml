# Traduit le français RELU quand l'étiquette « traduire » est posée (spec §1.2).
# Pousse un commit sur la branche de la PR, retire l'étiquette, commente, puis
# publie le statut culture-check lui-même (le commit du robot ne déclenche pas
# articles-check.yml — voir articles.yml).
name: Culture — traduction

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Groupe PARTAGÉ avec articles-publish.yml (voir son commentaire) : posée
# pendant une publication, l'étiquette attend son tour au lieu de traduire en
# parallèle — et la PR peut être fusionnée entre-temps, d'où l'étape « PR
# encore ouverte ? ».
concurrency:
  group: culture-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  translate:
    # Un rattrapage de/it (culture/backfill-*) n'est pas un article à traduire.
    if: >-
      github.event.label.name == 'traduire' &&
      startsWith(github.head_ref, 'culture/') &&
      !startsWith(github.head_ref, 'culture/backfill-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
    steps:
      # La charge de l'événement date du moment où l'étiquette a été posée : un
      # run qui a attendu la publication trouverait la branche fusionnée.
      - name: PR encore ouverte ?
        id: open
        run: |
          state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = OPEN ] || echo "PR $state : traduction sans objet."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.open.outputs.state == 'OPEN'
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.open.outputs.state == 'OPEN'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.open.outputs.state == 'OPEN'

      # Un échec de/it seul (facultatives) laisse culture-translate sortir en 0,
      # et culture-check ne lit leurs manques que comme des notes : le statut
      # culture-check ne dépend que de fr/en/hy/ru et de l'image. Le résumé
      # commenté sur la PR dit, lui, ce qui manque en de/it.
      - name: Traduire
        id: tr
        if: steps.open.outputs.state == 'OPEN'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTICLES_BASE_URL: ${{ vars.ARTICLES_BASE_URL }}
          ARTICLES_MODEL: ${{ vars.ARTICLES_MODEL }}
        run: |
          SLUG="${BRANCH#culture/}"
          node scripts/culture-translate.mjs "$SLUG" --summary "$RUNNER_TEMP/summary.md"

      - name: Pousser, commenter, publier le statut
        if: always() && steps.open.outputs.state == 'OPEN'
        run: |
          SLUG="${BRANCH#culture/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/culture
          git diff --cached --quiet || git commit -m "Culture : traductions de « $SLUG »"
          # Un relecteur a pu pousser pendant la traduction : sans rebase, le
          # push est refusé et bash -e abandonne l'étape avant le statut.
          if ! git pull --rebase origin "$BRANCH"; then
            git rebase --abort || true
            gh pr edit "$PR" --remove-label traduire || true
            gh pr comment "$PR" --body "La branche a changé pendant la traduction et le rebase a échoué : relancez la traduction en reposant l'étiquette « traduire »." || true
            # Le statut va sur la tête DISTANTE : le commit local n'a pas été poussé.
            gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse "origin/$BRANCH")" \
              -f state=failure -f context=culture-check -f description="Traduction à relancer : la branche a changé pendant la traduction" || true
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          gh pr edit "$PR" --remove-label traduire || true
          [ -f "$RUNNER_TEMP/summary.md" ] && gh pr comment "$PR" --body-file "$RUNNER_TEMP/summary.md"
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          if node scripts/culture-check.mjs --pr-body "$RUNNER_TEMP/body.md" "$SLUG" > "$RUNNER_TEMP/check.txt"; then state=success; else state=failure; fi
          cat "$RUNNER_TEMP/check.txt"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=culture-check -f description="$(tail -n 1 "$RUNNER_TEMP/check.txt")"
