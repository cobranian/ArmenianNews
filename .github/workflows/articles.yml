# Le brouillon Culture du jour (spec §1.1). Ouvre UNE PR par article, au plus
# deux en relecture à la fois (MAX_OPEN) ; rien ne part en production avant la
# fusion par un humain. Sous une semaine de sujets, ouvre une issue d'idées.
#
# PIÈGE GitHub : une PR ouverte ou un commit poussé avec le GITHUB_TOKEN ne
# déclenche AUCUN autre workflow. articles-check.yml ne tournerait donc jamais
# sur les commits du robot : ce job publie lui-même le statut culture-check.
name: Culture — brouillon quotidien

on:
  schedule:
    - cron: '0 3 * * *' # chaque nuit, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: culture-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Branches des PR ouvertes
        run: |
          gh pr list --state open --limit 200 --json headRefName --jq '[.[].headRefName]' > "$RUNNER_TEMP/open.json"

      - name: Issue d'idées déjà ouverte ?
        id: open-ideas
        # Seules les issues du robot comptent : le dépôt est public, une issue
        # homonyme ouverte par un tiers empêcherait sinon toute proposition.
        run: |
          n=$(gh issue list --state open --author app/github-actions --search 'in:title "Culture : idées de sujets"' --json number --jq 'length')
          if [ "$n" -gt 0 ]; then echo "flag=--ideas-open" >> "$GITHUB_OUTPUT"; fi

      - name: Rédiger
        id: draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTICLES_BASE_URL: ${{ vars.ARTICLES_BASE_URL }}
          ARTICLES_MODEL: ${{ vars.ARTICLES_MODEL }}
          IDEAS_FLAG: ${{ steps.open-ideas.outputs.flag }}
        run: |
          node scripts/culture-draft.mjs --open-branches "$RUNNER_TEMP/open.json" --out-body "$RUNNER_TEMP/body.md" --out-ideas "$RUNNER_TEMP/ideas.md" $IDEAS_FLAG

      - name: Ouvrir la PR de relecture
        if: steps.draft.outputs.slug != ''
        env:
          SLUG: ${{ steps.draft.outputs.slug }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "culture/$SLUG"
          git add src/data/culture
          git commit -m "Culture : brouillon « $TITLE »"
          git push -u origin "culture/$SLUG"
          gh label create traduire --color F28C28 --description "Traduire le français relu en en, hy et ru" 2>/dev/null || true
          gh pr create --base main --head "culture/$SLUG" --title "Culture : $TITLE" --body-file "$RUNNER_TEMP/body.md"
          if node scripts/culture-check.mjs "$SLUG" > "$RUNNER_TEMP/check.txt"; then state=success; else state=failure; fi
          cat "$RUNNER_TEMP/check.txt"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=culture-check -f description="$(tail -n 1 "$RUNNER_TEMP/check.txt")"

      # Après la PR : les deux peuvent partir la même nuit, et un échec de
      # l'issue ne doit pas retenir le brouillon.
      - name: Ouvrir l'issue d'idées
        if: steps.draft.outputs.ideas == '1'
        run: |
          gh issue create --title "Culture : idées de sujets" --body-file "$RUNNER_TEMP/ideas.md"
