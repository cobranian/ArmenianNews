name: Hourly snapshot & deploy

on:
  schedule:
    - cron: '0 * * * *' # every hour, on the hour (UTC)
  workflow_dispatch: {} # allow manual runs
  push:
    branches: [main]

permissions:
  contents: write # commit refreshed data
  issues: write # ouvrir/refermer l'alerte de prérendu (voir en fin de job)

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Les seuls tests du dépôt : ils gardent l'invariant « une langue = une
      # URL » et la réciprocité des hreflang. Ils ne touchent pas au réseau.
      - name: Tests
        run: npm test

      # Refresh news + agenda. Instagram/Facebook are curated and untouched.
      # Snapshot only on schedule/dispatch: a push to main just rebuilds &
      # redeploys (scrape skipped), so a code or docs change ships fast without
      # spending ~3-4 min re-scraping or leaving an extra snapshot commit. When a
      # push touches only code, that's exactly the intent; if you want a fresh
      # snapshot on demand, use the manual `workflow_dispatch` run.
      - name: Scrape hourly snapshot
        if: github.event_name != 'push'
        env:
          # Always-on Cloudflare Worker proxy for armradio (optional; the
          # scraper falls back to direct/Google News if unset). See proxy/.
          ARMRADIO_PROXY: ${{ vars.ARMRADIO_PROXY }}
          # Cloudflare Worker proxy for Asbarez — required from CI: both editions
          # 403 datacenter IPs, so without it the Asbarez feed comes back empty.
          ASBAREZ_PROXY: ${{ vars.ASBAREZ_PROXY }}
        run: npm run scrape

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/sitemap.xml n'est plus versionné : il en faut un par vitrine,
          # et ils sont générés au build (scripts/lib/sitemap.mjs), avec un
          # lastmod lu dans meta.json.generatedAt — donc l'heure de CE scrape.
          git add src/data/news.json src/data/agenda.json src/data/meta.json src/data/instagram-feed.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: hourly snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Build
        run: npm run build

      # Porte de validation du build. Sans elle, check-build.mjs ne s'exécute
      # jamais en automatique et ne protège rien. Volontairement SANS
      # continue-on-error : si les douze pages ou les deux sitemaps sont
      # incorrects, il vaut mieux ne rien publier que publier un site cassé.
      # Le contrôle est déterministe et entièrement dérivé de sites.config.js,
      # donc un faux positif signalerait une vraie divergence de configuration.
      - name: Contrôler les pages et les fichiers SEO produits
        run: npm run check

      # Regenerate the Don Narek carousel preview each hour and drop it into
      # dist/ch/ so the deploy publishes it (armenie-info.web.app/don-narek-*.png)
      # — dist/ch is the showcase that domain serves.
      # Best-effort: a screenshot failure must never block the deploy.
      #
      # v2 (et non v1) pour deux raisons. La visible : v1 tourne sur Node 20,
      # que les runners forcent déjà sur Node 24 en annonçant la fin du support.
      # La vraie : sous v2, `chrome-version: stable` installe **Chrome for
      # Testing** et non le Chrome officiel — c'est précisément le binaire
      # contre lequel Puppeteer est versionné, donc `scripts/shoot.mjs` y gagne
      # un couple navigateur/pilote reproductible.
      #
      # La sortie `chrome-path` n'a pas changé de nom, donc l'étape suivante est
      # intacte. Attention en revanche : les deux étapes sont
      # `continue-on-error: true`, donc **un job vert ne prouve rien ici** — si
      # le binaire devenait injoignable, la capture cesserait de se rafraîchir
      # en silence, exactement le piège documenté dans CLAUDE.md. Après un
      # changement de cette action, vérifiez le log de l'étape de capture, pas
      # la seule couleur du job.
      - name: Set up Chrome (for screenshot)
        id: chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Screenshot Don Narek carousel into dist/ch/
        continue-on-error: true
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run screenshot

      # Bake the rendered app into each showcase's index.html (twelve files:
      # every (site, lang, view) triple — home, /radio, /agenda|/events — across
      # dist/ch and dist/org) so crawlers get the snapshot's articles in raw
      # HTML instead of an empty #root.
      # Best-effort, like the screenshot: a prerender failure must never
      # block the deploy — worst case we ship the plain SPA, as before.
      - name: Prerender the twelve pages
        id: prerender
        continue-on-error: true
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run prerender

      # continue-on-error au-dessus rend l'échec silencieux dans l'UI Actions
      # (l'étape reste verte) — voulu, car un prérendu manqué ne doit pas
      # bloquer le déploiement de la SPA nue. Mais silencieux ne doit pas dire
      # invisible, et l'annotation `::warning::` seule ne suffisait pas : le
      # prérendu a échoué VINGT-QUATRE HEURES du 11 au 12 août 2026 sans que
      # personne ne le voie. Un warning ne notifie personne, ne survit pas au
      # défilement des exécutions horaires, et — le pire — **l'API GitHub ne
      # rapporte alors AUCUNE étape en échec** : `gh run view --json jobs` rend
      # `conclusion: success` pour une étape en `continue-on-error`, donc même
      # un contrôle scripté passe à côté. Il faut sortir des Actions.
      #
      # D'où une ISSUE, et non un échec de job : le déploiement doit continuer
      # (c'est tout le sens du continue-on-error), mais l'alerte doit persister
      # jusqu'à réparation et arriver par courriel.
      #
      # Trois propriétés à ne pas défaire :
      #   · DÉDOUBLONNÉE par le marqueur `[prerender-down]` dans le titre — sans
      #     quoi une panne d'une journée ouvrirait vingt-quatre issues. On
      #     cherche le marqueur plutôt qu'une étiquette pour n'avoir aucun label
      #     à créer au préalable : `gh issue create --label` échoue si
      #     l'étiquette n'existe pas.
      #   · ASSIGNÉE au propriétaire : GitHub notifie toujours un assigné, quels
      #     que soient ses réglages de suivi du dépôt. Sans cela l'alerte
      #     dépendrait d'un « Watch » qu'on peut avoir désactivé sans y penser.
      #   · REFERMÉE toute seule au retour (étape suivante). Dans les deux sens,
      #     comme `npm run radio-check` : sans le second sens, l'issue resterait
      #     ouverte pour toujours après la réparation et on cesserait de la lire.
      - name: Alerter sur un prérendu manqué
        if: steps.prerender.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning::Prérendu échoué — le site part en SPA nu, sans texte pour les crawlers."
          ouverte=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | contains("[prerender-down]"))] | .[0].number // empty')
          if [ -n "$ouverte" ]; then
            echo "Alerte déjà ouverte : #$ouverte — on n'en rouvre pas une par heure."
            exit 0
          fi
          gh issue create \
            --title "[prerender-down] Le prérendu échoue — les 12 pages partent sans texte" \
            --assignee cobranian \
            --body "$(cat <<EOF
          L'étape \`npm run prerender\` a échoué. Le déploiement a continué (c'est
          voulu), mais les douze pages sont servies en **SPA nue** : \`<div id="root"></div>\`
          vide, donc **aucun texte d'article pour les moteurs de recherche**.

          Les lecteurs ne voient rien : React s'hydrate côté navigateur. Ce sont les
          crawlers qui perdent tout.

          Exécution en cause : $RUN_URL

          ## Vérifier ce qui est réellement servi

          \`\`\`bash
          curl -s https://armenianews.org/ | grep -c '<div id="root"></div>'   # 1 = non prérendu
          \`\`\`

          Un HTML nu pèse ~72 ko, un HTML cuit ~264 ko.

          ## Cause la plus probable

          \`browser-actions/setup-chrome\` installe le Chrome **stable du jour**, alors
          que \`puppeteer-core\` est figé par le lockfile. Quand Chrome prend de
          l'avance, il devient impilotable et cette étape meurt — c'est exactement ce
          qui s'est produit le 11 août 2026 (151.0.7922.77 → .138).

          Relever les deux versions de part et d'autre de la bascule :

          \`\`\`bash
          gh run view <id> --log | grep -oE "Successfully setup chrome [0-9.]+"
          \`\`\`

          Le correctif est alors de **monter \`puppeteer-core\`**, pas d'épingler
          Chrome — épingler ne fait que geler la dette.

          Cette issue se referme toute seule dès qu'un prérendu réussit.
          EOF
          )"

      # Le second sens de l'alerte. Sans lui, l'issue resterait ouverte après la
      # réparation, et une alerte qui ne s'éteint jamais cesse d'être lue.
      - name: Refermer l'alerte si le prérendu est revenu
        if: steps.prerender.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | contains("[prerender-down]")) | .number' \
          | while read -r n; do
              [ -n "$n" ] || continue
              echo "Prérendu revenu — fermeture de #$n"
              gh issue close "$n" --comment "Prérendu revenu : les douze pages sont cuites. $RUN_URL"
            done

      - name: Deploy to Firebase Hosting
        env:
          # Dedicated deploy identity (github-action-*), Firebase Hosting Admin
          # and nothing else. The old secret held the firebase-adminsdk key,
          # which could also bypass database security rules and mint tokens for
          # other service accounts — far more than publishing a static site needs.
          #
          # UN SEUL secret pour DEUX projets, et ce n'est pas un oubli : ce
          # compte de service appartient à `armenie-info` et s'est vu accorder
          # le rôle Firebase Hosting Admin **sur `armenia-news-b146e` aussi**
          # (console Cloud → IAM du second projet → Accorder l'accès).
          #
          # Un compte de service n'a par défaut de droits que sur son propre
          # projet : sans cette autorisation croisée, le déploiement du .org
          # échouerait sur une erreur d'autorisation. Si vous révoquez ce rôle,
          # il faudra un second secret et un credential par vitrine.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARMENIE_INFO }}
        run: |
          # Échouer tôt et clairement si le secret manque. Sans cette garde, un
          # credential vide produit un fichier vide, et firebase-tools répond
          # une erreur d'authentification générique qui n'indique pas la cause.
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_ARMENIE_INFO absent ou vide — impossible de déployer."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          set +e
          fail=0
          # Un couple par vitrine : site | projet. Le nom de site suffirait à
          # firebase deploy (il est unique mondialement), mais --project est
          # nécessaire parce que les deux vitrines vivent dans deux projets.
          #
          # `while read` alimenté par un here-doc s'exécute dans le shell courant
          # (contrairement à un pipe), donc `fail` survit aux itérations.
          while IFS='|' read -r site project; do
            [ -z "$site" ] && continue
            echo "▸ déploiement de $site (projet $project)"
            # Pinned, not @latest: this runs with the deploy service account in
            # its environment, so a single malicious release would hand over the
            # credential. Bump deliberately.
            out=$(npx --yes firebase-tools@15.23.0 deploy \
              --only "hosting:$site" --project "$project" --non-interactive 2>&1)
            code=$?
            echo "$out"
            # Firebase rejette une publication dont le contenu est identique à la
            # version en ligne (p. ex. une heure sans changement de données).
            # C'est un no-op réussi, pas un échec. En déployant site par site,
            # ce verdict ne porte que sur CE site — une sortie combinée pourrait
            # sinon faire passer l'échec de l'un pour le no-op de l'autre.
            if [ $code -ne 0 ] && echo "$out" | grep -qi "is the current active version"; then
              echo "::notice::$site — contenu inchangé, déjà en ligne. Ignoré."
              continue
            fi
            if [ $code -ne 0 ]; then
              echo "::error::$site (projet $project) — échec du déploiement (code $code)"
              fail=1
            fi
          done <<EOF
          armenie-info|armenie-info
          armenia-news-org|armenia-news-b146e
          EOF
          exit $fail

      # Ce que `npm run check` ne peut PAS voir : un code HTTP. Il compare des
      # chaînes dans dist/ ; or le soft 404 — l'accueil servi en 200 à toute URL
      # inconnue, par le rewrite ** → index.html — était une propriété de la
      # configuration Firebase, pas du HTML. Il a tenu des semaines sans qu'un
      # seul contrôle ne tombe. On sonde donc la production après chaque
      # déploiement : une URL qui ne peut pas exister doit répondre 404, et le
      # slug jumeau de l'autre langue doit rediriger. Quelques essais espacés,
      # parce que le CDN met parfois une dizaine de secondes à servir la
      # nouvelle version.
      - name: Sonder la production (404 francs, slugs jumeaux)
        run: |
          probe() {  # url, code attendu
            for i in 1 2 3 4; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
              [ "$code" = "$2" ] && { echo "✓ $1 → $code"; return 0; }
              sleep 10
            done
            echo "::error::$1 répond $code, attendu $2"
            return 1
          }
          fail=0
          probe "https://armenieinfo.ch/sonde-404-$GITHUB_RUN_ID/" 404 || fail=1
          probe "https://armenianews.org/sonde-404-$GITHUB_RUN_ID/" 404 || fail=1
          probe "https://armenieinfo.ch/events/" 301 || fail=1
          probe "https://armenianews.org/agenda/" 301 || fail=1
          probe "https://armenianews.org/fr/" 301 || fail=1
          exit $fail
