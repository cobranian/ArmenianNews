name: Lettre — envoi hebdomadaire

# Une fois par semaine ISO et par lettre (une par langue), le numéro de la semaine part à
# Buttondown (scripts/newsletter-send.mjs). Trois passages (lundi, mardi,
# mercredi) : le registre src/data/newsletter-sent.json fait qu'un seul envoie,
# et rattrape un lundi sauté par le cron de GitHub (il en saute, voir
# CLAUDE.md). NEWSLETTER_STATUS (variable de l'environnement `newsletter`)
# choisit le statut Buttondown ; non posée, le numéro est créé en BROUILLON.
#
# Le passage PLANIFIÉ ne tourne que si la variable de dépôt NEWSLETTER_ENABLED
# vaut `true` (variable du DÉPÔT : le `if:` du job est évalué avant que
# l'environnement `newsletter` ne soit chargé) — à poser seulement après le test manuel du brouillon (README,
# « Lettre et RSS »). Le lancement manuel (workflow_dispatch) tourne toujours :
# c'est lui qui sert à ce test.
#
# :50 et non :23/:30 : le snapshot horaire (hourly.yml) pousse sur main sans
# rebase vers :23-:28 ; un push du registre au même moment le ferait échouer.
on:
  schedule:
    - cron: '50 5 * * 1,2,3'
  workflow_dispatch:

# Deux runs simultanés planifieraient le même numéro avant que l'un ait poussé
# le registre.
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: newsletter
    permissions:
      contents: write # pousser le registre src/data/newsletter-sent.json
      issues: write # ouvrir/refermer l'alerte [newsletter-down]
    env:
      NEWSLETTER_STATUS: ${{ vars.NEWSLETTER_STATUS }}
      BUTTONDOWN_API_KEY_CH: ${{ secrets.BUTTONDOWN_API_KEY_CH }}
      BUTTONDOWN_API_KEY_ORG: ${{ secrets.BUTTONDOWN_API_KEY_ORG }}
      BUTTONDOWN_API_KEY_DE: ${{ secrets.BUTTONDOWN_API_KEY_DE }}
      BUTTONDOWN_API_KEY_IT: ${{ secrets.BUTTONDOWN_API_KEY_IT }}
      BUTTONDOWN_API_KEY_HY: ${{ secrets.BUTTONDOWN_API_KEY_HY }}
      BUTTONDOWN_API_KEY_RU: ${{ secrets.BUTTONDOWN_API_KEY_RU }}
      BUTTONDOWN_API_KEY_ES: ${{ secrets.BUTTONDOWN_API_KEY_ES }}
    steps:
      # main et non le commit du déclencheur : brèves, Culture et agenda y sont
      # poussés chaque heure par le snapshot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Choisir quoi envoyer
        run: node scripts/newsletter-send.mjs plan --out "$RUNNER_TEMP/newsletter-plan.json"

      # AVANT l'envoi : un run annulé ensuite perd au pire un numéro, il n'en
      # double jamais. Un push refusé fait échouer l'étape, donc rien ne part —
      # le passage suivant recalculera le plan.
      - name: Enregistrer le registre avant l'envoi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/newsletter-sent.json
          if git diff --cached --quiet; then
            echo "Registre inchangé."
          else
            git commit -m "newsletter: registre $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi

      - name: Envoyer
        id: send
        run: node scripts/newsletter-send.mjs send --plan "$RUNNER_TEMP/newsletter-plan.json" --report "$RUNNER_TEMP/newsletter-report.json"

      # Un numéro REFUSÉ par Buttondown a été rendu au registre par `send` :
      # le pousser fait repartir la lettre au passage du lendemain (mardi,
      # mercredi). Payé le 2 nov. 2026 : sept refus restés inscrits à W45.
      - name: Rendre au registre les numéros refusés
        if: always()
        run: |
          git add src/data/newsletter-sent.json
          if git diff --cached --quiet; then
            echo "Aucun numéro rendu."
          else
            git commit -m "newsletter: numéros refusés rendus au registre $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi

      # Un 2xx à la création ne prouve pas la livraison.
      - name: Vérifier la livraison
        id: verify
        if: always() && steps.send.conclusion != 'skipped'
        run: node scripts/newsletter-send.mjs verify --report "$RUNNER_TEMP/newsletter-report.json"

      # Alerte dédoublonnée sur le marqueur du titre, ASSIGNÉE (un assigné est
      # toujours notifié), refermée seule au premier passage sans échec —
      # même mécanique que [prerender-down] dans hourly.yml.
      - name: Alerter (issue [newsletter-down])
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ECHEC: ${{ job.status != 'success' }}
          LIVRES: ${{ steps.verify.outputs.delivered || 0 }}
        run: |
          ouverte=$(gh issue list --state open --author app/github-actions --search 'in:title "[newsletter-down]"' \
            --json number,title --jq '[.[] | select(.title | contains("[newsletter-down]"))] | .[0].number // empty')
          if [ "$ECHEC" = "true" ]; then
            corps="La lettre hebdomadaire n'est pas partie entièrement. Log : $RUN_URL

          Un numéro refusé par Buttondown est rendu au registre et repart au passage suivant (lundi, mardi, mercredi à 05:50 UTC). Lire les lignes ✗ newsletter/ du log."
            if [ -n "$ouverte" ]; then
              gh issue comment "$ouverte" --body "$corps"
            else
              gh issue create --title "[newsletter-down] La lettre hebdomadaire n'est pas partie" \
                --assignee cobranian --body "$corps"
            fi
          elif [ -n "$ouverte" ] && [ "$LIVRES" -gt 0 ]; then
            gh issue close "$ouverte" --comment "Lettre partie et livrée : $RUN_URL"
          fi
