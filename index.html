<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100f0d" />

    <!-- Métadonnées propres au couple (site, langue) : titre, description,
         canonical, hreflang, Open Graph, JSON-LD, vérification Search Console.
         Générées par scripts/lib/site-meta.mjs depuis sites.config.js, et
         injectées ici par le plugin siteMeta() de vite.config.js.
         Ne rien écrire en dur à la place : les quatre pages divergeraient, et
         des hreflang divergents sont ignorés par Google. -->
    <!--SITE_META-->

    <!-- Google Analytics 4 (Consent Mode v2 — consentement PAR RÉGION :
         accordé par défaut, donc avec cookies et visiteurs récurrents
         identifiés, sauf dans l'EEE et au Royaume-Uni où le RGPD exige un
         accord préalable et où GA retombe sur sa mesure anonyme sans cookie.
         La Suisse est délibérément hors de la liste, la nLPD n'imposant pas
         le consentement préalable — le raisonnement complet est dans
         ga-init.js). ga-init.js est
         servi depuis 'self' (comme theme-init.js) pour garder la CSP stricte ;
         il définit le consentement et la config AVANT que gtag.js ne s'exécute.
         Domaines autorisés dans la CSP de firebase.json (script-src /
         connect-src). L'ID de mesure GA4 (G-EB3W5XXSMW) doit rester identique
         ici ET dans ga-init.js. -->
    <script src="/ga-init.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EB3W5XXSMW"></script>

    <!-- Ararat's twin peaks, apricot on basalt. SVG for modern browsers, PNG
         for the ones that ignore it, 180px for the iOS home screen.
         Google only accepts a favicon whose side is a multiple of 48px, so the
         raster sizes are 48/96/192 — a 32px icon is silently skipped and the
         search result falls back to a generic globe. /favicon.ico exists for
         the same reason: Google fetches that path whether or not it is
         declared, and Firebase's SPA rewrite answers any missing file with
         index.html — a 200 of text/html, which reads as a broken icon rather
         than as an absent one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- "Apricot Press" typography: Fraunces (optical display serif),
         Hanken Grotesk (body grotesque), Space Mono (datelines / wire),
         Noto Serif + Sans Armenian (Armenian script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Armenian:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- set saved day/night theme before paint to avoid a flash -->
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Cloudflare Web Analytics (sans cookie, RGPD-friendly). Le domaine du
         script et celui d'envoi des données sont autorisés dans la CSP de
         firebase.json (script-src / connect-src). -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "40017296bb8845b8b659cb9cc34dae77"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
