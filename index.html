<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100f0d" />

    <!-- Métadonnées propres au couple (site, langue) : titre, description,
         canonical, hreflang, Open Graph, JSON-LD, vérification Search Console.
         Générées par scripts/lib/site-meta.mjs depuis sites.config.js, et
         injectées ici par le plugin siteMeta() de vite.config.js.
         Ne rien écrire en dur à la place : les quatre pages divergeraient, et
         des hreflang divergents sont ignorés par Google. -->
    <!--SITE_META-->

    <!-- Google Analytics 4 (Consent Mode v2 — consentement PAR RÉGION :
         accordé par défaut, donc avec cookies et visiteurs récurrents
         identifiés, sauf dans l'EEE et au Royaume-Uni où le RGPD exige un
         accord préalable et où GA retombe sur sa mesure anonyme sans cookie.
         La Suisse est délibérément hors de la liste, la nLPD n'imposant pas
         le consentement préalable — le raisonnement complet est dans
         ga-init.js). ga-init.js est
         servi depuis 'self' (comme theme-init.js) pour garder la CSP stricte ;
         il définit le consentement et la config AVANT que gtag.js ne s'exécute.
         Domaines autorisés dans la CSP de firebase.json (script-src /
         connect-src).

         Les deux balises sont générées par scripts/lib/site-meta.mjs à partir
         du `gaMeasurementId` de la vitrine bâtie : ne les réécrivez pas en dur
         ici. Ce fichier est partagé par les deux vitrines, donc un ID unique
         verserait les visites des deux domaines dans la même propriété — ce
         qu'il faisait, /hy/ et /ru/ compris. -->
    <!--GA_TAG-->

    <!-- Ararat's twin peaks, apricot on basalt. SVG for modern browsers, PNG
         for the ones that ignore it, 180px for the iOS home screen.
         Google only accepts a favicon whose side is a multiple of 48px, so the
         raster sizes are 48/96/192 — a 32px icon is silently skipped and the
         search result falls back to a generic globe. /favicon.ico exists for
         the same reason: Google fetches that path whether or not it is
         declared, and Firebase's SPA rewrite answers any missing file with
         index.html — a 200 of text/html, which reads as a broken icon rather
         than as an absent one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- "Apricot Press" typography — trois rôles × trois écritures. Le détail
         du casting et des réglages optiques est dans src/styles/global.css
         (section « Familles »), qui est la source de vérité ; ici on ne fait
         que charger les fichiers.

           rôle      | latin (fr/en)   | arménien (hy)       | cyrillique (ru)
           ----------+-----------------+---------------------+----------------
           display   | Fraunces        | Noto Serif Armenian | Literata
           body      | Hanken Grotesk  | Noto Sans Armenian  | Golos Text
           utility   | Space Mono      | Noto Sans Armenian  | IBM Plex Mono

         Les trois familles cyrilliques ne sont pas un supplément décoratif :
         AUCUNE des cinq autres ne couvre U+0400-045F (les lettres russes).
         Sans elles, /ru/ rendait ses titres en Georgia, son texte en Segoe UI
         et ses surtitres en Courier — donc une page par système d'exploitation,
         et jamais celle de la marque. Vérifiable :
           curl '…/css2?family=Hanken+Grotesk' | grep unicode-range
         ne montre que `cyrillic-ext` (U+0460-052F, du cyrillique historique
         que le russe n'utilise pas) — le piège est là, la famille a l'air
         d'avoir du cyrillique et n'en a pas.

         LES POLICES SONT AUTO-HÉBERGÉES (public/fonts/, déclarées dans
         src/styles/fonts.css, importée par global.css) : ce sont les mêmes
         .woff2 découpés par `unicode-range` que servait Google Fonts, obtenus
         par `npm run fonts-sync` (scripts/fonts-sync.mjs). La feuille Google
         était une ressource bloquante cross-origin qui coûtait ~800 ms au
         premier rendu mobile ; servies d'ici, les polices partent sur la
         connexion déjà ouverte et les deux ou trois fichiers du premier écran
         sont préchargés PAR LANGUE par scripts/lib/site-meta.mjs (bloc
         SITE_META ci-dessus). Ne remettez pas de <link> fonts.googleapis.com
         ici : ajoutez la famille à FONTS_CSS2 et relancez la synchronisation.
         Une page latine ne télécharge toujours aucun .woff2 de plus — le
         découpage par unicode-range est conservé tel quel. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- set saved day/night theme before paint to avoid a flash -->
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Cloudflare Web Analytics (sans cookie, RGPD-friendly). Le domaine du
         script et celui d'envoi des données sont autorisés dans la CSP de
         firebase.json (script-src / connect-src).
         La balise est générée par scripts/lib/site-meta.mjs à partir du
         `cfBeaconToken` de la vitrine bâtie : ne la réécrivez pas en dur ici,
         un jeton unique verserait les visites des deux domaines dans le même
         tableau de bord. Une vitrine sans jeton n'émet rien. -->
    <!--CF_BEACON-->
  </body>
</html>
