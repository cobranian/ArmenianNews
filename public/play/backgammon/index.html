<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backgammon — plateau de marqueterie</title>
  <meta name="description" content="Backgammon sur un plateau de marqueterie : dames d'ivoire et d'ébène, vrais dés, videau, matchs en 1, 3 ou 5 points contre un robot à trois niveaux.">
  <meta name="theme-color" content="#3B4654">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="fonts/polices.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="page">
    <section id="partie" aria-label="Partie" data-i18n-aria="partie">
      <header id="panneau">
        <p id="score">Toi 0 – 0 Robot · match en 3</p>
        <p id="manche">Manche 1</p>
        <p id="crawford" hidden data-i18n="crawford">Crawford</p>
        <p id="videau-texte">Videau à 1, au centre</p>
        <p id="ligne-pseudo" hidden><label for="pseudo" data-i18n="pseudo">Ton prénom</label><input id="pseudo" dir="auto" type="text" maxlength="20" autocomplete="nickname" spellcheck="false"></p>
        <button type="button" id="btn-menu" class="discret" data-i18n="menu">Menu</button>
      </header>

      <div id="plateau" dir="ltr" tabindex="-1" role="group" aria-label="Plateau, vu de ton côté : ton jan intérieur est en bas à droite">
        <!-- Le SVG, les boutons des points et les dés sont construits par plateau.js et main.js. -->
        <div id="des-n" class="des gauche" role="img" aria-label="Pas de dés" data-i18n-aria="pasDeDes"></div>
        <div id="des-b" class="des droite" role="img" aria-label="Pas de dés" data-i18n-aria="pasDeDes"></div>
      </div>

      <p id="annonce" role="status" aria-live="polite"></p>

      <p id="reclamation" role="status" hidden>
        <span id="reclamation-texte" data-i18n="reclamationTexte">Ton ami ne joue plus depuis 3 min.</span>
        <button type="button" id="btn-reclamer" class="plaque claire" data-i18n="reclamer">Réclamer la victoire</button>
      </p>

      <p id="commandes">
        <button type="button" id="btn-doubler" class="plaque" hidden data-i18n="doubler">Doubler</button>
        <button type="button" id="btn-lancer" class="plaque" hidden data-i18n="lancer">Lancer</button>
        <button type="button" id="btn-annuler" class="plaque claire" hidden data-i18n="annulerPas">Annuler</button>
        <button type="button" id="btn-valider" class="plaque" hidden data-i18n="valider">Valider</button>
      </p>
    </section>

    <section class="ecran" id="ecran-menu" aria-labelledby="menu-titre">
      <div class="carte-menu">
        <h1 id="menu-titre" data-i18n="nom">Backgammon</h1>
        <div class="frise" aria-hidden="true"></div>
        <fieldset id="choix-mode" aria-label="Adversaire" data-i18n-aria="adversaire">
          <label><input type="radio" name="mode" value="robot" checked> <span data-i18n="contreRobot">Contre le robot</span></label>
          <label><input type="radio" name="mode" value="ami"> <span data-i18n="avecAmi">Avec un ami</span></label>
        </fieldset>
        <fieldset id="choix-niveau">
          <legend data-i18n="niveau">Niveau</legend>
          <label><input type="radio" name="niveau" value="facile"> <span data-i18n="facile">Facile</span></label>
          <label><input type="radio" name="niveau" value="moyen"> <span data-i18n="moyen">Moyen</span></label>
          <label><input type="radio" name="niveau" value="fort"> <span data-i18n="fort">Fort</span></label>
        </fieldset>
        <fieldset>
          <legend data-i18n="match">Match</legend>
          <label><input type="radio" name="longueur" value="1"> <span data-i18n-n="points" data-n="1">1 point</span></label>
          <label><input type="radio" name="longueur" value="3"> <span data-i18n-n="points" data-n="3">3 points</span></label>
          <label><input type="radio" name="longueur" value="5"> <span data-i18n-n="points" data-n="5">5 points</span></label>
        </fieldset>
        <p class="case-videau">
          <label><input type="checkbox" id="videau" checked> <span data-i18n="videau">Videau</span></label>
          <small id="videau-note" data-i18n="videauNote">pas de videau en match d'un point</small>
        </p>
        <button type="button" id="btn-jouer" class="plaque grande" data-i18n="jouer">Jouer</button>
      </div>
    </section>

    <section class="ecran" id="ecran-invite" hidden aria-labelledby="invite-titre">
      <div class="carte-menu">
        <h2 id="invite-titre" data-i18n="inviteTitre">Invite ton ami</h2>
        <div class="frise" aria-hidden="true"></div>
        <p class="consigne" data-i18n="consigne">Envoie ce lien à ton ami, ou montre-lui le QR code.</p>
        <div id="qr" role="img" aria-label="QR code du lien d'invitation" data-i18n-aria="qrAria"></div>
        <p class="ligne-lien"><input id="lien" dir="ltr" type="text" readonly aria-label="Lien d'invitation" data-i18n-aria="lienAria"><button type="button" id="copier" class="plaque claire" data-i18n="copier">Copier le lien</button></p>
        <button type="button" id="invite-annuler" class="discret" data-i18n="annulerInvite">Annuler</button>
      </div>
    </section>

    <section class="ecran" id="ecran-attente" hidden>
      <div class="carte-menu">
        <p id="attente-statut" role="status" aria-live="polite"></p>
        <button type="button" id="attente-retour" class="plaque" data-i18n="menu">Menu</button>
      </div>
    </section>

    <section class="ecran voile" id="ecran-double" hidden role="dialog" aria-modal="true" aria-labelledby="double-texte">
      <div class="cartouche">
        <p id="double-texte">Le robot double à 2.</p>
        <p class="boutons">
          <button type="button" id="btn-accepter" class="plaque" data-i18n="accepter">Accepter</button>
          <button type="button" id="btn-refuser" class="plaque claire" data-i18n="refuser">Refuser</button>
        </p>
      </div>
    </section>

    <section class="ecran voile" id="ecran-fin" hidden role="dialog" aria-modal="true" aria-labelledby="fin-texte" aria-describedby="fin-score">
      <div class="cartouche">
        <p id="fin-texte"></p>
        <p id="fin-score"></p>
        <p class="boutons">
          <button type="button" id="btn-suivante" class="plaque" data-i18n="suivante">Manche suivante</button>
          <button type="button" id="btn-nouveau" class="plaque" hidden data-i18n="nouveau">Nouveau match</button>
          <button type="button" id="btn-fin-menu" class="plaque claire" data-i18n="menu">Menu</button>
        </p>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
  <script src="/play/retour.js" defer></script>
</body>
</html>
